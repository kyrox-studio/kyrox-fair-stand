name: CI

# Yalnız PR'da koşar: main ruleset'i zorunlu kontrol + strict ister; merge edilen ağaç
# PR'da test edilen ağaçla aynıdır, main'de tekrar koşu gereksiz (kyrox-platform QUALITY_GATE §12).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Sürümler canlı sunucuyla aynı (kyrox-platform standards/development/ORTAM_SURUMLERI.md).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Change contract gate
        run: npm run contract:verify

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:deps

      - name: Source syntax check
        run: npm run syntax:check

      - name: Test
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Catalog API tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pytest

      # Uyarı yalnız: açık varsa deploy durur (2026-11-13 kararı); yama requirements.lock.txt'de PR ile yapılır.
      - name: Python dependency audit (warning only)
        working-directory: backend
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --quiet "pip-audit>=2.7"
          if ! "$RUNNER_TEMP/pip-audit/bin/pip-audit" -r requirements.lock.txt --progress-spinner off > "$RUNNER_TEMP/pip-audit.txt" 2>&1; then
            echo "::warning title=pip-audit::backend/requirements.lock.txt için bilinen açık (veya denetim hatası); adım log'una bakın. Açık varsa deploy durur; yama kilit dosyasında PR ile yapılır."
          fi
          cat "$RUNNER_TEMP/pip-audit.txt"

      - name: Build
        run: npm run build

      - name: Install E2E runner
        run: npm run e2e:deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
